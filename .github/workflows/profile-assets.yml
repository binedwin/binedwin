name: Update Profile Assets

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/generate_profile_assets.py"
      - ".github/workflows/profile-assets.yml"

permissions:
  contents: write

jobs:
  profile-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate profile SVG assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_profile_assets.py

      - name: Commit updated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/contribution-galaxy.svg output/github-signals.svg
          git diff --cached --quiet && exit 0
          git commit -m "Update profile assets"
          git push
