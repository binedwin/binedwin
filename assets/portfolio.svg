<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-labelledby="title desc">
  <title id="title">Lee Jeongbin Robot Software Developer Portfolio</title>
  <desc id="desc">Open the portfolio featuring ROS2, Vision AI, robot control, and system integration projects.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050914" />
      <stop offset="0.58" stop-color="#0b1324" />
      <stop offset="1" stop-color="#101b2e" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399" />
      <stop offset="0.52" stop-color="#7dd3fc" />
      <stop offset="1" stop-color="#60a5fa" />
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#94a3b8" stroke-width="1" opacity="0.055" />
    </pattern>
  </defs>

  <rect width="1200" height="230" rx="24" fill="url(#background)" />
  <rect x="1" y="1" width="1198" height="228" rx="23" fill="none" stroke="#334155" stroke-width="2" />
  <rect width="1200" height="230" rx="24" fill="url(#grid)" />
  <rect x="0" y="0" width="7" height="230" rx="3.5" fill="url(#accent)" />

  <g transform="translate(62 48)">
    <text x="0" y="0" fill="#7dd3fc" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">PORTFOLIO</text>
    <text x="0" y="48" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">ROBOT SOFTWARE DEVELOPER</text>
    <text x="0" y="82" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="18">Lee Jeongbin · Building reliable intelligence for real-world robots</text>

    <g transform="translate(0 119)" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600">
      <circle cx="6" cy="0" r="6" fill="#34d399" />
      <text x="21" y="5" fill="#d1fae5">ROS2</text>
      <path d="M 75 0 H 105" stroke="#475569" stroke-width="2" />
      <circle cx="111" cy="0" r="6" fill="#7dd3fc" />
      <text x="126" y="5" fill="#e0f2fe">VISION AI</text>
      <path d="M 213 0 H 243" stroke="#475569" stroke-width="2" />
      <circle cx="249" cy="0" r="6" fill="#60a5fa" />
      <text x="264" y="5" fill="#dbeafe">ROBOT CONTROL</text>
      <path d="M 385 0 H 415" stroke="#475569" stroke-width="2" />
      <circle cx="421" cy="0" r="6" fill="#a78bfa" />
      <text x="436" y="5" fill="#ede9fe">SYSTEM INTEGRATION</text>

      <circle cx="6" cy="0" r="3" fill="#ffffff" filter="url(#glow)">
        <animate attributeName="cx" values="6;111;249;421;6" keyTimes="0;0.24;0.52;0.78;1" dur="7s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0;1;1;1;0" dur="7s" repeatCount="indefinite" />
      </circle>
    </g>
  </g>

  <g transform="translate(872 55)">
    <rect width="270" height="120" rx="8" fill="#0f1b2d" stroke="#3b82f6" stroke-width="1.5" />
    <path d="M 24 29 H 246" stroke="#334155" />
    <circle cx="26" cy="17" r="3" fill="#34d399" />
    <circle cx="38" cy="17" r="3" fill="#7dd3fc" />
    <circle cx="50" cy="17" r="3" fill="#60a5fa" />
    <text x="24" y="61" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">VIEW PORTFOLIO</text>
    <text x="24" y="88" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="13">binedwin.github.io/Portfolio</text>
    <g transform="translate(218 50)" fill="none" stroke="#7dd3fc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 0 22 L 22 0" />
      <path d="M 7 0 H 22 V 15" />
      <animateTransform attributeName="transform" type="translate" values="218 50;222 46;218 50" dur="2.4s" repeatCount="indefinite" />
    </g>
  </g>
</svg>
